<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insights · PrivateHire Cars</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-root=".." data-area="staff">
    <main id="main" class="container">
        <h1>Insights</h1>
        <p class="lead">Track popular cars and loyal customers.</p>

        <section class="card" aria-labelledby="filter-title">
            <h2 id="filter-title">Date range</h2>
            <form id="insights-filter" class="field-row">
                <label class="field" for="start-date">
          Start date
          <input id="start-date" name="start-date" type="date">
        </label>

                <label class="field" for="end-date">
          End date
          <input id="end-date" name="end-date" type="date">
        </label>

                <div class="field">
                    <span class="sr-only">Apply date filter</span>
                    <button class="btn btn-primary" type="submit">Update insights</button>
                </div>
            </form>
            <p id="filter-message" class="muted" role="status" aria-live="polite"></p>
        </section>

        <section class="card" aria-labelledby="cars-title">
            <h2 id="cars-title">Top 5 most-booked car models</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Car model</th>
                            <th scope="col">Bookings</th>
                        </tr>
                    </thead>
                    <tbody id="car-insights-rows"></tbody>
                </table>
            </div>
            <p id="car-empty" class="muted" hidden>No data for this period.</p>
        </section>

        <section class="card" aria-labelledby="customers-title">
            <h2 id="customers-title">Loyal customers</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Customer</th>
                            <th scope="col">Bookings</th>
                            <th scope="col">Total spend</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="customer-insights-rows"></tbody>
                </table>
            </div>
            <p id="customer-empty" class="muted" hidden>No data for this period.</p>
        </section>

        <section id="customer-history" class="card" hidden aria-live="polite"></section>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/rules.js"></script>
    <script src="../js/staff-insights.js"></script>
</body>

</html>
