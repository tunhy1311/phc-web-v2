<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · PrivateHire Cars</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-root=".." data-area="tests">
  <main id="main" class="container">
    <h1>Unit tests</h1>
    <p class="lead">Pure business rules (js/rules.js) and validators (js/validators.js). Every case shows pass or fail.</p>
    <p class="test-summary" id="test-summary" role="status">Running…</p>
    <ul class="test-list" id="test-results"></ul>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/validators.js"></script>
  <script src="../js/rules.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/book-service.js"></script>
  <script src="../js/booking-changes.js"></script>
  <script src="../js/receipt-rules.js"></script>
  <script src="../js/payment-rules.js"></script>

  <!-- Tiny test runner: PHCTest.test(name, fn), PHCTest.equal(actual, expected), PHCTest.throws(fn) -->
  <script>
    var PHCTest = (function () {
      var cases = [];
      function test(name, fn) { cases.push({ name: name, fn: fn }); }
      function equal(actual, expected) {
        if (actual !== expected) {
          throw new Error("expected " + JSON.stringify(expected) + " but got " + JSON.stringify(actual));
        }
      }
      function throws(fn) {
        try { fn(); } catch (e) { return; }
        throw new Error("expected an error to be thrown");
      }
      function run() {
        var list = document.getElementById("test-results");
        var passed = 0;
        var results = cases.map(function (c) {
          var ok = true, message = "";
          try { c.fn(); } catch (e) { ok = false; message = e && e.message ? e.message : String(e); }
          if (ok) passed++;
          var li = document.createElement("li");
          li.innerHTML =
            '<span class="' + (ok ? "test-pass" : "test-fail") + '">' + (ok ? "pass" : "fail") + "</span>" +
            "<span>" + PHCUI.escapeHtml(c.name) +
            (message ? ' <span class="muted">(' + PHCUI.escapeHtml(message) + ")</span>" : "") + "</span>";
          list.appendChild(li);
          return { name: c.name, pass: ok, message: message };
        });
        var failed = cases.length - passed;
        var summary = document.getElementById("test-summary");
        summary.textContent = passed + " / " + cases.length + " passed" + (failed ? " · " + failed + " failed" : "");
        summary.className = "test-summary " + (failed ? "test-fail" : "test-pass");
        window.PHC_TEST_RESULTS = { total: cases.length, passed: passed, failed: failed, results: results };
      }
      return { test: test, equal: equal, throws: throws, run: run };
    })();
  </script>
  <script src="rules.test.js"></script>
  <script src="auth.test.js"></script>
  <script src="service.test.js"></script>
  <script src="changes.test.js"></script>
  <script src="receipt.test.js"></script>
  <script src="payment.test.js"></script>
  <script>PHCTest.run();</script>
</body>
</html>
