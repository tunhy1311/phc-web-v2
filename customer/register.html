<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account · PrivateHire Cars</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-root=".." data-area="customer">
    <main id="main" class="container">
        <h1>Create an account</h1>
        <p class="lead">Register to book online and get 15% off every journey.</p>

        <!-- TODO (owner TBD: registration form, use PHCValidate + PHCUI.setFieldError): build this page inside #page-root.
         Header and footer come from js/ui.js - do not copy them into this file. -->
        <div id="page-root" class="card">
            <form id="register-form" class="form" novalidate>
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" autocomplete="street-address" required></textarea>
                </div>

                <div class="field">
                    <label for="phone">Phone number</label>
                    <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="07123 456789" required>
                    <p class="hint">Enter a UK phone number.</p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                    <p class="hint">Use at least 8 characters.</p>
                </div>

                <div class="field">
                    <label for="card-number">Card number</label>
                    <input id="card-number" name="card-number" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" required>
                </div>

                <button class="btn btn-primary" type="submit">Create account</button>
            </form>

            <p class="muted">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/validators.js"></script>
    <script src="../js/customer-register.js"></script>
</body>

</html>
