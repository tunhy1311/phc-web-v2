<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a car · PrivateHire Cars</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-root=".." data-area="customer">
  <main id="main" class="container">
    <h1>Book a car</h1>
    <p class="lead">Choose a service, add your journey details and check the summary. Online bookings get 15% off.</p>

    <!--
      Booking flow = 3 sections. Only one is visible at a time (toggle the "hidden" attribute).
      Shared state: PHCStore.get("draftBooking") / PHCStore.update("draftBooking", fn).
    -->

    <!-- ===== STEP 1 - US04 - owner: Huy =====
         Fill #step-service: list PHC_DATA.services as .choice buttons (.choice.selected when picked).
         Write the choice into draftBooking: { service, flight (if needsFlight), hours (if byTime) }.
         Then hide #step-service and show #step-details. -->
    <section id="step-service"></section>

    <!-- ===== STEP 2 - US05 - owner: Phuc.N =====
         Fill #step-details: pick-up / drop-off, date-time, passengers, etc.
         Read draftBooking written by US04. -->
    <section id="step-details" hidden></section>

    <!-- ===== STEP 3 - US05 - owner: Phuc.N =====
         Fill #step-summary: summary and price (PHCRules.baseFare + PHCRules.applyOnlineDiscount).
         Add <script src="../js/rules.js"></script> and <script src="../js/validators.js"></script>
         below when these steps need them. -->
    <section id="step-summary" hidden></section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <!-- Page scripts for US04 / US05 go here, e.g. <script src="../js/book.js"></script> -->
</body>
</html>
